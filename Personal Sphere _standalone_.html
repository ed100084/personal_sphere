  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html lang=\"zh-Hant\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Personal Sphere — 把世界裝進家裡<\u002Ftitle>\n<script src=\"6f4bfa23-f59c-4a48-bec8-b52773137f60\"><\u002Fscript>\n\n<style>\n  /* ─────────────────────────────────────────────────────────\n     Design system  —  Personal Sphere\n     Apple-like, 極簡精品、白灰、乾淨\n     ───────────────────────────────────────────────────────── */\n  :root {\n    --bg:        #fafafa;\n    --bg-alt:   #f2f2f3;\n    --bg-dark:   #0a0a0c;\n    --ink:       #0a0a0c;\n    --ink-2:     #2c2c30;\n    --ink-3:     #6a6a70;\n    --ink-4:     #a8a8ad;\n    --ink-5:     #d8d8dc;\n    --rule:      #e6e6ea;\n    --accent:    oklch(0.58 0.02 250);\n    --glow:      oklch(0.88 0.03 250);\n\n    --f-display: \"Helvetica Neue\", Helvetica, -apple-system, BlinkMacSystemFont, \"Segoe UI\", \"PingFang TC\", \"Noto Sans TC\", sans-serif;\n    --f-mono:    ui-monospace, \"SF Mono\", Menlo, Consolas, monospace;\n  }\n\n  html, body { margin: 0; padding: 0; background: #000; color: var(--ink); font-family: var(--f-display); }\n  * { box-sizing: border-box; }\n\n  section.slide {\n    width: 1920px; height: 1080px;\n    background: var(--bg);\n    color: var(--ink);\n    position: relative;\n    overflow: hidden;\n    font-feature-settings: \"ss01\", \"kern\", \"liga\";\n    -webkit-font-smoothing: antialiased;\n    font-smooth: always;\n  }\n  section.slide.dark { background: var(--bg-dark); color: #fff; }\n  section.slide.dark .ink-3 { color: rgba(255,255,255,0.55); }\n  section.slide.dark .rule  { background: rgba(255,255,255,0.12); }\n\n  /* typography */\n  .eyebrow {\n    font-size: 16px; letter-spacing: 0.22em; text-transform: uppercase;\n    font-weight: 500; color: var(--ink-3);\n  }\n  .display {\n    font-size: 148px; line-height: 0.96; letter-spacing: -0.035em;\n    font-weight: 300; margin: 0; color: var(--ink);\n  }\n  .display strong { font-weight: 500; }\n  .headline {\n    font-size: 96px; line-height: 1.02; letter-spacing: -0.03em;\n    font-weight: 300; margin: 0;\n  }\n  .headline strong { font-weight: 500; }\n  .title {\n    font-size: 64px; line-height: 1.05; letter-spacing: -0.025em;\n    font-weight: 400; margin: 0;\n  }\n  .body {\n    font-size: 26px; line-height: 1.5; color: var(--ink-2);\n    font-weight: 400; max-width: 720px;\n  }\n  .small { font-size: 18px; color: var(--ink-3); line-height: 1.5; }\n  .mono  { font-family: var(--f-mono); font-size: 14px; letter-spacing: 0.03em; color: var(--ink-3); }\n\n  /* chrome: pagination + wordmark */\n  .wordmark {\n    position: absolute; top: 48px; left: 64px;\n    font-size: 15px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase;\n    color: var(--ink-3); display: flex; align-items: center; gap: 10px;\n  }\n  .wordmark .dot {\n    width: 10px; height: 10px; border-radius: 999px;\n    background: radial-gradient(circle at 30% 30%, #fff, #bdbdc3 55%, #6a6a70 100%);\n    box-shadow: 0 1px 2px rgba(0,0,0,0.15);\n  }\n  .dark .wordmark { color: rgba(255,255,255,0.55); }\n  .dark .wordmark .dot {\n    background: radial-gradient(circle at 30% 30%, #fff, #9a9aa0 45%, #2c2c30 100%);\n  }\n\n  .pager {\n    position: absolute; top: 48px; right: 64px;\n    font-family: var(--f-mono); font-size: 13px; letter-spacing: 0.08em;\n    color: var(--ink-4);\n  }\n  .dark .pager { color: rgba(255,255,255,0.35); }\n\n  .footline {\n    position: absolute; left: 64px; right: 64px; bottom: 48px;\n    display: flex; justify-content: space-between; align-items: center;\n    font-family: var(--f-mono); font-size: 13px; letter-spacing: 0.06em;\n    color: var(--ink-4);\n  }\n  .dark .footline { color: rgba(255,255,255,0.35); }\n\n  /* ── Slide 01: Title ────────────────────────────────────── */\n  .s-title .core {\n    position: absolute; inset: 0;\n    display: grid; place-items: center;\n    text-align: center;\n  }\n  .s-title .display { font-size: 180px; }\n  .s-title .eyebrow { margin-bottom: 40px; }\n  .s-title .tag {\n    margin-top: 40px; font-size: 22px; color: var(--ink-3); letter-spacing: -0.01em;\n  }\n  /* giant soft sphere behind title */\n  .s-title .orb {\n    position: absolute; left: 50%; top: 58%; transform: translate(-50%, -50%);\n    width: 1400px; height: 1400px; border-radius: 999px;\n    background:\n      radial-gradient(circle at 38% 34%, #ffffff 0%, #f4f4f6 22%, #e3e3e8 46%, #c8c8ce 72%, #a5a5ab 100%);\n    box-shadow:\n      inset -60px -90px 180px rgba(0,0,0,0.12),\n      inset  80px  60px 160px rgba(255,255,255,0.85),\n      0 60px 120px rgba(0,0,0,0.05);\n    opacity: 0.35;\n    filter: blur(0.2px);\n  }\n  .s-title .orb::after {\n    content: \"\"; position: absolute; left: 22%; top: 16%;\n    width: 28%; height: 14%; border-radius: 999px;\n    background: radial-gradient(ellipse, rgba(255,255,255,0.9), rgba(255,255,255,0) 70%);\n  }\n  .s-title .core-inner { position: relative; z-index: 2; }\n\n  /* ── Slide 02: Problem ──────────────────────────────────── */\n  .s-problem .grid {\n    position: absolute; inset: 220px 120px 160px 120px;\n    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 48px;\n    align-content: center;\n  }\n  .s-problem .card {\n    border-top: 1px solid var(--rule);\n    padding-top: 28px;\n    display: flex; flex-direction: column; gap: 24px;\n  }\n  .s-problem .card .num {\n    font-family: var(--f-mono); font-size: 13px; color: var(--ink-4); letter-spacing: 0.08em;\n  }\n  .s-problem .card h3 {\n    margin: 0; font-size: 44px; font-weight: 400; letter-spacing: -0.02em; line-height: 1.1;\n  }\n  .s-problem .card p {\n    margin: 0; font-size: 20px; line-height: 1.5; color: var(--ink-3); max-width: 440px;\n  }\n  .s-problem .svg-ill {\n    width: 120px; height: 72px; color: var(--ink-2);\n  }\n  .s-problem .head {\n    position: absolute; top: 140px; left: 120px; right: 120px;\n    display: flex; justify-content: space-between; align-items: flex-end;\n  }\n\n g>Personal<\u002Fstrong><br>Sphere.<\u002Fh1>\n        <div class=\"tag\">把世界裝進家裡。<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"footline\"><span>CONCEPT DECK<\u002Fspan><span>APR 2026<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ─────────── 02 · Problem ─────────── -->\n  <section class=\"slide s-problem\" data-label=\"Problem\">\n    <div class=\"wordmark\"><span class=\"dot\"><\u002Fspan>Personal Sphere<\u002Fdiv>\n    <div class=\"pager\">02 / 08<\u002Fdiv>\n    <div class=\"head\">\n      <div>\n        <div class=\"eyebrow\" style=\"margin-bottom:20px;\">The Problem<\u002Fdiv>\n        <h2 class=\"headline\">家裡的畫面，<br>始終<strong>只是一面牆<\u002Fstrong>。<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"grid\">\n      <div class=\"card\">\n        <svg class=\"svg-ill\" viewBox=\"0 0 120 72\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\">\n          <rect x=\"10\" y=\"10\" width=\"100\" height=\"52\" rx=\"3\"><\u002Frect>\n          <line x1=\"10\" y1=\"62\" x2=\"110\" y2=\"62\"><\u002Fline>\n          <line x1=\"52\" y1=\"62\" x2=\"50\" y2=\"70\"><\u002Fline>\n          <line x1=\"68\" y1=\"62\" x2=\"70\" y2=\"70\"><\u002Fline>\n        <\u002Fsvg>\n        <div>\n          <div class=\"num\">01<\u002Fdiv>\n          <h3 style=\"margin-top:10px;\">電視太平<\u002Fh3>\n        <\u002Fdiv>\n        <p>再大的螢幕，仍被框在牆上。視覺停在眼前，身體沒有進去。<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <svg class=\"svg-ill\" viewBox=\"0 0 120 72\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\">\n          <path d=\"M15 36 L50 18 L50 54 Z\"><\u002Fpath>\n          <rect x=\"55\" y=\"14\" width=\"55\" height=\"44\" rx=\"1\" opacity=\"0.5\"><\u002Frect>\n          <path d=\"M50 36 L110 20\" stroke-dasharray=\"2 3\"><\u002Fpath>\n          <path d=\"M50 36 L110 52\" stroke-dasharray=\"2 3\"><\u002Fpath>\n        <\u002Fsvg>\n        <div>\n          <div class=\"num\">02<\u002Fdiv>\n          <h3 style=\"margin-top:10px;\ data-val=\"poetic\">詩意<\u002Fdiv>\n      <div class=\"opt\" data-val=\"direct\">直接<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"row\">\n    <label>強調色<\u002Flabel>\n    <div class=\"opts\" data-group=\"accent\" style=\"gap:8px;\">\n      <div class=\"swatch sel\" data-val=\"slate\" style=\"background:oklch(0.58 0.02 250);\"><\u002Fdiv>\n      <div class=\"swatch\" data-val=\"warm\" style=\"background:oklch(0.62 0.08 50);\"><\u002Fdiv>\n      <div class=\"swatch\" data-val=\"green\" style=\"background:oklch(0.58 0.06 150);\"><\u002Fdiv>\n      <div class=\"swatch\" data-val=\"mono\" style=\"background:#0a0a0c;\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"row\">\n    <label>封面文字<\u002Flabel>\n    <div class=\"opts\" data-group=\"title\">\n      <div class=\"opt sel\" data-val=\"zh\">中<\u002Fdiv>\n      <div class=\"opt\" data-val=\"en\">EN<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script type=\"application/json\" id=\"tweaks-defaults\">\n/*EDITMODE-BEGIN*/{\n  \"tone\": \"poetic\",\n  \"accent\": \"warm\",\n  \"title\": \"en\"\n}/*EDITMODE-END*/\n<\u002Fscript>\n\n<script>\n(function(){\n  // ── Tweaks protocol ─────────────────────────────────────\n  const panel = document.getElementById('tweaks');\n  const defaultsRaw = document.getElementById('tweaks-defaults').textContent;\n  const m = defaultsRaw.match(/\\/\\*EDITMODE-BEGIN\\*\\/([\\s\\S]*?)\\/\\*EDITMODE-END\\*\\//);\n  let state = m ? JSON.parse(m[1]) : { tone:'poetic', accent:'slate', title:'zh' };\n\n  // Copy variants\n  const titles = {\n    zh: { display: '<strong>Personal<\u002Fstrong><br/>Sphere.', tag: '把世界裝進家裡。' },\n    en: { display: '<strong>Personal<\u002Fstrong><br/>Sphere.', tag: 'Bring the world indoors.' }\n  };\n  const tones = {\n    poetic: {\n      problem:    '家裡的畫面，<br/>始終<strong>只是一面牆<\u002Fstrong>。',\n      concept:    '一張把你<strong>包起來<\u002Fstrong>的螢幕。',\n      visual:     '視野裡的<br/>每一度，<br/>都是畫面。',\n      sound:      '聲音<br/>有<strong>座標<\u002Fstrong>。',\n      scenarios:  '在家，<strong>去任何地方<\u002Fstrong>。',\n      specs:      '一顆<strong>安靜的工程<\u002Fstrong>。'\n    },\n    direct: {\n      problem:    '今天的螢幕<br/><strong>還不夠大<\u002Fstrong>。',\n      concept:    '220 度<strong>曲面螢幕<\u002Fstrong>。',\n      visual:     '16K 解析度，<br/>4,000 尼特，<br/>無邊框。',\n      sound:      '64 聲道<br/><strong>空間聲場<\u002Fstrong>。',\n      scenarios:  '四種情境，<strong>無限可能<\u002Fstrong>。',\n      specs:      '規格。'\n    }\n  };\n  const accents = {\n    slate: 'oklch(0.58 0.02 250)',\n    warm:  'oklch(0.62 0.08 50)',\n    green: 'oklch(0.58 0.06 150)',\n    mono:  '#0a0a0c'\n  };\n\n  function apply() {\n    // Title slide\n    const titleDisplay = document.querySelector('.s-title .display');\n    const titleTag = document.querySelector('.s-title .tag');\n    if (titleDisplay) titleDisplay.innerHTML = titles[state.title].display;\n    if (titleTag) titleTag.textContent = titles[state.title].tag;\n\n    // Tone-sensitive headlines\n    const t = tones[state.tone];\n    const byId = {\n      '.s-problem .headline':   t.problem,\n      '.s-concept .label-top h2': t.concept,\n      '.s-visual .headline':    t.visual,\n      '.s-sound .headline':     t.sound,\n      '.s-scenarios .headline': t.scenarios,\n      '.s-specs .headline':     t.specs\n    };\n    Object.entries(byId).forEach(([sel, html]) => {\n      const el = document.querySelector(sel);\n      if (el) el.innerHTML = html;\n    });\n\n    // Accent color\n    document.documentElement.style.setProperty('--accent', accents[state.accent]);\n\n    // update UI\n    panel.querySelectorAll('[data-group]').forEach(g => {\n      const k = g.dataset.group;\n      g.querySelectorAll('[data-val]').forEach(o => {\n        o.classList.toggle('sel', o.dataset.val === state[k]);\n      });\n    });\n  }\n\n  panel.addEventListener('click', (e) => {\n    const opt = e.target.closest('[data-val]');\n    if (!opt) return;\n    const group = opt.parentElement.dataset.group;\n    state = Object.assign({}, state, { [group]: opt.dataset.val });\n    apply();\n    try {\n      window.parent.postMessage({ type: '__edit_mode_set_keys', edits: state }, '*');\n    } catch(err) {}\n  });\n\n  // listen for host toggle BEFORE announcing\n  window.addEventListener('message', (e) => {\n    const d = e.data;\n    if (!d || typeof d !== 'object') return;\n    if (d.type === '__activate_edit_mode')   panel.classList.add('on');\n    if (d.type === '__deactivate_edit_mode') panel.classList.remove('on');\n  });\n  try { window.parent.postMessage({ type: '__edit_mode_available' }, '*'); } catch(e){}\n\n  apply();\n})();\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
